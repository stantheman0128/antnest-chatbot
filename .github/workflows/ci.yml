name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier check
        run: npx prettier --check .
      - name: ESLint
        run: npx eslint .
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
